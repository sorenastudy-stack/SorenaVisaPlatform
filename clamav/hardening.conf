# ── PR-AV slice 2 — clamd hardening ────────────────────────────────────────
#
# Appended to the image's own /etc/clamav/clamd.conf at build time. The
# Dockerfile deletes any earlier occurrence of each directive first, so every
# one of these appears exactly once and ours is the value that applies — clamd
# does not reliably let a later line override an earlier one.
#
# Only the directives below are ours. Everything else the stock image sets
# (sockets, user, logging, PID file) is left exactly as it was, because those
# are what let the container boot at all.

# Encrypted archives and documents are REJECTED, not passed through as clean.
# clamd cannot see inside a password-protected container, and "I could not look"
# must not read as "there was nothing to find". This platform has no upload
# surface with a legitimate reason to accept an encrypted file — receipts,
# visa documents, spreadsheets and images are all things we need to be able to
# open ourselves.
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes

# OLE2 (legacy .doc/.xls) parsing on, and any macro found in an OLE2 container
# is an alert. The application layer already refuses macro-enabled OOXML by
# extension and mime (.docm/.xlsm/…); this covers the older container format
# that carries macros without announcing them in the file name.
ScanOLE2 yes
OLE2BlockMacros yes

# Pinned rather than left on the stock 25M default. The platform's largest
# app-level cap is 20 MB (provider marketing), so 50 MB is real margin: an
# upload that the app accepted can never be one clamd refuses to read. This is
# the number that must move first if any app cap is ever raised.
StreamMaxLength 50M

# At or above what the stock image was already logging — deliberately not
# lowered. Recorded here so a future image bump that quietly reduces a default
# shows up as a diff rather than as a behaviour change nobody noticed.
MaxScanSize 400M
MaxFileSize 100M
MaxRecursion 17
MaxFiles 10000

# A file that exceeds the limits above alerts instead of returning a clean
# verdict on a partial scan. Unreachable in practice (app caps are ≤20 MB
# against a 400 MB scan budget) but the default direction is wrong: "too big to
# finish scanning" resolving to OK is the same silent pass this whole slice
# exists to remove.
AlertExceedsMax yes
