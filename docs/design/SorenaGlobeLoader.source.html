document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

dde6f1;\n  }\n  body { display: grid; place-items: center; }\n  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }\n\n  .stage {\n    width: 1120px;\n    height: 640px;\n    position: relative;\n    background: var(--bg-0);\n    border: 1px solid rgba(255,255,255,0.05);\n    box-shadow:\n      0 30px 80px rgba(0,0,0,0.6),\n      inset 0 0 120px rgba(0,0,0,0.6);\n    overflow: hidden;\n  }\n\n  /* Subtle film-grain overlay */\n  .stage::after {\n    content: \"\";\n    position: absolute; inset: 0;\n    background-image:\n      radial-gradient(rgba(255,255,255,0.025) 1px, transparent 1px);\n    background-size: 3px 3px;\n    mix-blend-mode: overlay;\n    pointer-events: none;\n    opacity: 0.5;\n  }\n  /* Vignette */\n  .stage::before {\n    content: \"\";\n    position: absolute; inset: 0;\n    background: radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(0,0,0,0.85) 100%);\n    pointer-events: none;\n    z-index: 3;\n  }\n\n  /* HUD bars */\n  .hud {\n    position: absolute; left: 0; right: 0;\n    height: 36px;\n    display: flex; align-items: center;\n    padding: 0 18px;\n    z-index: 4;\n    font-size: 11px;\n    letter-spacing: 0.18em;\n    text-transform: uppercase;\n    color: #b9c3d0;\n  }\n  .hud.top    { top: 0;     border-bottom: 1px solid rgba(255,255,255,0.05); }\n  .hud.bottom { bottom: 0;  border-top:    1px solid rgba(255,255,255,0.05); }\n  .hud .group { display: flex; align-items: center; gap: 14px; }\n  .hud .spacer { flex: 1; }\n  .hud .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: live-dot 1.4s ease-in-out infinite; }\n  .hud .pill {\n    border: 1px solid rgba(255,255,255,0.10);\n    padding: 4px 9px; border-radius: 2px;\n    background: rgba(255,255,255,0.02);\n  }\n  .hud .accent { color: var(--accent-bright); }\n\n  /* Map sits between HUDs */\n  .map-wrap {\n    position: absolute;\n    top: 36px; bottom: 36px; left: 0; right: 0;\n  }\n  svg.map { width: 100%; height: 100%; display: block; overflow: visible; }\n\n  /* Map paint */\n  .sphere { fill: var(--ocean); }\n  .graticule { fill: none; stroke: var(--grid); stroke-width: 0.25; stroke-dasharray: 0.6 1.2; }\n  .graticule-major { fill: none; stroke: var(--grid-strong); stroke-width: 0.35; }\n  .country {\n    fill: var(--land);\n    stroke: rgba(200, 225, 245, 0.45);\n    stroke-width: 0.22;\n    stroke-linejoin: round;\n  }\n  .country.alt { fill: var(--land-2); }\n\n  /* Active country */\n  .country.active {\n    fill: var(--accent);\n    stroke: #fff;\n    stroke-width: 0.6;\n    filter: url(#glow-strong);\n    animation: country-pulse 2.2s ease-in-out infinite;\n  }\n\n  /* Pulse rings */\n  .ping {\n    fill: none;\n    stroke: var(--accent-bright);\n    stroke-width: 0.6;\n    transform-box: fill-box;\n    transform-origin: center;\n    animation: ping 2.4s cubic-bezier(.2,.7,.3,1) infinite;\n  }\n\n  /* Marker dot at country center */\n  .marker {\n    fill: var(--accent-bright);\n    stroke: #fff;\n    stroke-width: 0.3;\n    filter: url(#glow);\n  }\n\n  /* Targeting brackets around active countries */\n  .bracket {\n    fill: none;\n    stroke: var(--accent-bright);\n    stroke-width: 0.7;\n    stroke-linecap: square;\n    animation: bracket-blink 2.4s steps(2, jump-none) infinite;\n  }\n\n  /* Leader lines to labels */\n  .leader {\n    fill: none;\n    stroke: var(--accent-bright);\n    stroke-width: 0.35;\n    stroke-dasharray: 1.2 1.2;\n    opacity: 0.85;\n  }\n  .leader-dot {\n    fill: var(--accent-bright);\n  }\n\n  /* Country list panel */\n  .panel {\n    position: absolute;\n    top: 56px;\n    right: 24px;\n    z-index: 5;\n    background: rgba(10, 18, 32, 0.72);\n    backdrop-filter: blur(6px);\n    -webkit-backdrop-filter: blur(6px);\n    border: 1px solid rgba(255, 211, 122, 0.35);\n    box-shadow: 0 0 24px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04) inset;\n    padding: 14px 18px 14px 14px;\n    min-width: 220px;\n  }\n  .panel-title {\n    font-size: 10px;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: var(--accent-bright);\n    margin-bottom: 10px;\n    display: flex; align-items: center; gap: 8px;\n  }\n  .panel-title::before {\n    content: \"\";\n    width: 14px; height: 1px;\n    background: var(--accent-bright);\n  }\n  .panel-title::after {\n    content: \"\";\n    flex: 1; height: 1px;\n    background: rgba(255,211,122,0.25);\n  }\n  .panel ul {\n    list-style: none; margin: 0; padding: 0;\n    display: flex; flex-direction: column; gap: 6px;\n  }\n  .panel li {\n    display: grid;\n    grid-template-columns: 14px 1fr auto;\n    align-items: center;\n    gap: 10px;\n    font-size: 12px;\n    letter-spacing: 0.14em;\n    text-transform: uppercase;\n    color: #eaf1fb;\n  }\n  .panel .name { font-weight: 600; }\n  .panel .iso  {\n    font-family: 'JetBrains Mono', monospace;\n    font-size: 10px;\n    letter-spacing: 0.1em;\n    color: var(--accent-bright);\n    opacity: 0.9;\n  }\n  .panel .iso.hub { color: #fff; background: var(--accent); padding: 1px 5px; border-radius: 1px; }\n  .panel .led {\n    width: 8px; height: 8px; border-radius: 50%;\n    background: var(--accent-bright);\n    box-shadow: 0 0 8px var(--accent-glow), 0 0 0 2px rgba(255,211,122,0.18);\n    animation: led-pulse 1.6s ease-in-out infinite;\n  }\n  @keyframes led-pulse {\n    0%, 100% { opacity: 1;   transform: scale(1);   }\n    50%      { opacity: 0.45; transform: scale(0.85); }\n  }\n\n  /* Great-circle arcs */\n  .arc {\n    fill: none;\n    stroke: var(--accent-bright);\n    stroke-width: 0.45;\n    stroke-linecap: round;\n    stroke-dasharray: 1.5 2.5;\n    opacity: 0.55;\n    filter: url(#glow);\n  }\n  .arc-traveler {\n    fill: var(--accent-bright);\n    filter: url(#glow);\n  }\n\n  /* Sweeping radar bar */\n  .sweep {\n    pointer-events: none;\n    mix-blend-mode: screen;\n    opacity: 0.55;\n    animation: sweep 6s linear infinite;\n  }\n\n  /* Top-left + corner ticks */\n  .corner-tick {\n    stroke: rgba(180,210,230,0.45);\n    stroke-width: 0.5;\n    fill: none;\n  }\n\n  /* Animations */\n  @keyframes country-pulse {\n    0%, 100% { fill: var(--accent); }\n    50%      { fill: var(--accent-bright); }\n  }\n  @keyframes ping {\n    0%   { transform: scale(0.4); opacity: 0.9; }\n    100% { transform: scale(5.5); opacity: 0;   }\n  }\n  @keyframes bracket-blink {\n    0%, 60% { opacity: 1; }\n    61%, 100% { opacity: 0.35; }\n  }\n  @keyframes sweep {\n    0%   { transform: translateX(-30%); }\n    100% { transform: translateX(130%); }\n  }\n  @keyframes live-dot {\n    0%, 100% { opacity: 1; transform: scale(1); }\n    50%      { opacity: 0.4; transform: scale(0.7); }\n  }\n  @keyframes traveler {\n    0%   { offset-distance: 0%;   opacity: 0; }\n    8%   { opacity: 1; }\n    92%  { opacity: 1; }\n    100% { offset-distance: 100%; opacity: 0; }\n  }\n\n  /* Faint global network spokes (all countries -> NZ) */\n  .net-arc {\n    fill: none;\n    stroke: var(--cyan);\n    stroke-width: 0.18;\n    stroke-opacity: 0.22;\n  }\n  /* Blinking light on every country */\n  .net-light {\n    fill: var(--cyan);\n    animation: net-blink 2.6s ease-in-out infinite;\n  }\n  .net-traveler {\n    fill: var(--accent-bright);\n    filter: url(#glow);\n  }\n  @keyframes net-blink {\n    0%, 100% { opacity: 0.15; }\n    50%      { opacity: 0.95; }\n  }\n\n  /* SORNA watermark */\n  .watermark { pointer-events: none; position: absolute; inset: 36px 0; z-index: 2; }\n  .watermark img {\n    position: absolute;\n    top: 50%; left: 50%;\n    transform: translate(-50%, -50%);\n    width: 54%;\n    opacity: 0.30;\n    filter: drop-shadow(0 0 14px rgba(0,0,0,0.75)) drop-shadow(0 0 4px rgba(255,255,255,0.35));\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  \n  <div class=\"stage\" role=\"status\" aria-label=\"Global operations monitor\">\n\n    <!-- Top HUD -->\n    <div class=\"hud top\">\n      <div class=\"group\">\n        <span class=\"dot\"><\u002Fspan>\n        <span class=\"accent\">LIVE<\u002Fspan>\n        <span>Sorena Visa · Global Migration Network<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"spacer\"><\u002Fdiv>\n      <div class=\"group mono\">\n        <span class=\"pill\" id=\"ts\">2026·05·22 / 00:00:00 UTC<\u002Fspan>\n        <span class=\"pill\">CLIENTS · 2,400+<\u002Fspan>\n        <span class=\"pill accent\">HQ · AUCKLAND<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Active regions panel -->\n    <div class=\"panel\" id=\"panel\">\n      <div class=\"panel-title\">Destination Hub<\u002Fdiv>\n      <ul id=\"panel-list\"><\u002Ful>\n    <\u002Fdiv>\n\n    <!-- SORENA VISA watermark -->\n    <div class=\"watermark\" aria-hidden=\"true\">\n      <img src=\"e15eab27-9daf-4313-9d8e-ce4a7d510325\" alt=\"\">\n    <\u002Fdiv>\n\n    <!-- Map -->\n    <div class=\"map-wrap\">\n      <svg class=\"map\" viewBox=\"0 0 280 145\" preserveAspectRatio=\"xMidYMid meet\">\n        <defs>\n          <filter id=\"glow\" x=\"-50%\" y=\"-50%\" width=\"200%\" height=\"200%\">\n            <feGaussianBlur stdDeviation=\"0.5\" result=\"blur\"><\u002FfeGaussianBlur>\n            <feMerge>\n              <feMergeNode in=\"blur\"><\u002FfeMergeNode><feMergeNode in=\"SourceGraphic\"><\u002FfeMergeNode>\n            <\u002FfeMerge>\n          <\u002Ffilter>\n          <filter id=\"glow-strong\" x=\"-50%\" y=\"-50%\" width=\"200%\" height=\"200%\">\n            <feGaussianBlur stdDeviation=\"1.4\" result=\"blur\"><\u002FfeGaussianBlur>\n            <feMerge>\n              <feMergeNode in=\"blur\"><\u002FfeMergeNode><feMergeNode in=\"SourceGraphic\"><\u002FfeMergeNode>\n            <\u002FfeMerge>\n          <\u002Ffilter>\n          <linearGradient id=\"sweep-grad\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n            <stop offset=\"0%\" stop-color=\"#7feaff\" stop-opacity=\"0\"><\u002Fstop>\n            <stop offset=\"48%\" stop-color=\"#7feaff\" stop-opacity=\"0.35\"><\u002Fstop>\n            <stop offset=\"50%\" stop-color=\"#ffffff\" stop-opacity=\"0.6\"><\u002Fstop>\n            <stop offset=\"52%\" stop-color=\"#7feaff\" stop-opacity=\"0.35\"><\u002Fstop>\n            <stop offset=\"100%\" stop-color=\"#7feaff\" stop-opacity=\"0\"><\u002Fstop>\n          <\u002FlinearGradient>\n        <\u002Fdefs>\n\n        <path class=\"sphere\" id=\"m-sphere\"><\u002Fpath>\n        <path class=\"graticule\" id=\"m-graticule\"><\u002Fpath>\n        <path class=\"graticule-major\" id=\"m-graticule-major\"><\u002Fpath>\n\n        <g id=\"m-countries\"><\u002Fg>\n        <g id=\"m-net-arcs\"><\u002Fg>     <!-- faint spokes: every country -> NZ -->\n        <g id=\"m-net-lights\"><\u002Fg>  <!-- blinking light on every country -->\n        <g id=\"m-arcs\"><\u002Fg>\n        <g id=\"m-active\"><\u002Fg>      <!-- active country fills on top -->\n        <g id=\"m-pings\"><\u002Fg>\n        <g id=\"m-markers\"><\u002Fg>\n        <g id=\"m-brackets\"><\u002Fg>\n        <g id=\"m-labels\"><\u002Fg>\n\n        <!-- Radar sweep -->\n        <g class=\"sweep\">\n          <rect x=\"0\" y=\"0\" width=\"40\" height=\"145\" fill=\"url(#sweep-grad)\"><\u002Frect>\n        <\u002Fg>\n\n        <!-- Corner ticks -->\n        <g class=\"corner-tick\">\n          <path d=\"M 2 6 L 2 2 L 6 2\"><\u002Fpath>\n          <path d=\"M 278 6 L 278 2 L 274 2\"><\u002Fpath>\n          <path d=\"M 2 139 L 2 143 L 6 143\"><\u002Fpath>\n          <path d=\"M 278 139 L 278 143 L 274 143\"><\u002Fpath>\n        <\u002Fg>\n      <\u002Fsvg>\n    <\u002Fdiv>\n\n    <!-- Bottom HUD -->\n    <div class=\"hud bottom\">\n      <div class=\"group\">\n        <span class=\"accent\">DESTINATION · NEW ZEALAND<\u002Fspan>\n        <span class=\"pill mono\">WORK · STUDY · RESIDENCE<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"spacer\"><\u002Fdiv>\n      <div class=\"group mono\">\n        <span id=\"ping\">PING 042ms<\u002Fspan>\n        <span class=\"pill\">LICENSED ADVISER<\u002Fspan>\n        <span class=\"pill accent\">SORENAVISA.COM<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<script src=\"ddc96d21-9e84-41ba-9d0d-8398d9cff7db\"><\u002Fscript>\n<script src=\"72b1674c-b5cc-45f1-8d2c-94ce415cbf8f\"><\u002Fscript>\n<script>\n  (async () => {\n    const W = 280, H = 145;\n\n    // Natural Earth, centered on New Zealand\n    const projection = d3.geoNaturalEarth1().rotate([-174, 0]);\n    const path = d3.geoPath(projection);\n    projection.fitExtent([[6, 6], [W - 6, H - 6]], { type: 'Sphere' });\n\n    const graticule = d3.geoGraticule().step([15, 15]);\n    const graticuleMajor = d3.geoGraticule().step([60, 30]);\n\n    document.getElementById('m-sphere').setAttribute('d', path({ type: 'Sphere' }));\n    document.getElementById('m-graticule').setAttribute('d', path(graticule()));\n    document.getElementById('m-graticule-major').setAttribute('d', path(graticuleMajor()));\n\n    const ACTIVE = [\n      { id: '554', name: 'NEW ZEALAND', iso: 'NZL', hub: true },\n    ];\n    // Normalize all ids to zero-padded 3-digit strings to match world-atlas\n    const norm = (id) => String(id).padStart(3, '0');\n    const ACTIVE_IDS = new Set(ACTIVE.map(a => norm(a.id)));\n\n    let world;\n    try {\n      const res = await fetch('https://unpkg.com/world-atlas@2.0.2/countries-110m.json');\n      world = await res.json();\n    } catch (e) {\n      console.error('world-atlas fetch failed', e);\n    }\n    if (!world) return;\n\n    const countries = topojson.feature(world, world.objects.countries).features;\n\n    // Countries (base layer) — checkerboard alt fill for editorial feel\n    const countriesEl = document.getElementById('m-countries');\n    const activeEl    = document.getElementById('m-active');\n    const arcsEl      = document.getElementById('m-arcs');\n    const pingsEl     = document.getElementById('m-pings');\n    const markersEl   = document.getElementById('m-markers');\n    const bracketsEl  = document.getElementById('m-brackets');\n    const labelsEl    = document.getElementById('m-labels');\n\n    let cHtml = '', aHtml = '';\n    for (const f of countries) {\n      const id = norm(f.id);\n      const d  = path(f);\n      if (!d) continue;\n      if (ACTIVE_IDS.has(id)) {\n        aHtml += `<path class=\"country active\" d=\"${d}\" data-id=\"${id}\"><\u002Fpath>`;\n      } else {\n        // alternate fill based on hashed id for subtle variation\n        let h = 0; for (const ch of id) h = (h*31 + ch.charCodeAt(0))|0;\n        const alt = (Math.abs(h) % 3 === 0) ? ' alt' : '';\n        cHtml += `<path class=\"country${alt}\" d=\"${d}\"><\u002Fpath>`;\n      }\n    }\n    countriesEl.innerHTML = cHtml;\n    activeEl.innerHTML    = aHtml;\n\n    // Centroids + pixel positions for active countries\n    const active = ACTIVE.map(a => {\n      const target = norm(a.id);\n      const f = countries.find(c => norm(c.id) === target);\n      const c = f ? d3.geoCentroid(f) : [0,0];\n      const p = projection(c);\n      return { ...a, feature: f, lonlat: c, x: p[0], y: p[1] };\n    });\n\n    // Concentric pings (multiple staggered per country)\n    let pHtml = '';\n    active.forEach((a, i) => {\n      for (let k = 0; k < 3; k++) {\n        const delay = (i * 0.3 + k * 0.8).toFixed(2);\n        pHtml += `<circle class=\"ping\" cx=\"${a.x.toFixed(2)}\" cy=\"${a.y.toFixed(2)}\" r=\"1.2\" style=\"animation-delay:${delay}s\"/>`;\n      }\n    });\n    pingsEl.innerHTML = pHtml;\n\n    // Markers\n    let mHtml = '';\n    active.forEach(a => {\n      mHtml += `<circle class=\"marker\" cx=\"${a.x.toFixed(2)}\" cy=\"${a.y.toFixed(2)}\" r=\"1.1\"/>`;\n    });\n    markersEl.innerHTML = mHtml;\n\n    // Targeting brackets around each active country (axis-aligned, sized to its bbox)\n    let bHtml = '';\n    active.forEach(a => {\n      const f = a.feature;\n      if (!f) return;\n      const [[x0, y0], [x1, y1]] = path.bounds(f);\n      const pad = 1.4;\n      const X0 = x0 - pad, Y0 = y0 - pad, X1 = x1 + pad, Y1 = y1 + pad;\n      const t = Math.min(3, (X1 - X0) * 0.22, (Y1 - Y0) * 0.22); // tick length\n      bHtml += `<g class=\"bracket\">\n        <path d=\"M ${X0} ${Y0 + t} L ${X0} ${Y0} L ${X0 + t} ${Y0}\"/>\n        <path d=\"M ${X1 - t} ${Y0} L ${X1} ${Y0} L ${X1} ${Y0 + t}\"/>\n        <path d=\"M ${X0} ${Y1 - t} L ${X0} ${Y1} L ${X0 + t} ${Y1}\"/>\n        <path d=\"M ${X1 - t} ${Y1} L ${X1} ${Y1} L ${X1} ${Y1 - t}\"/>\n      <\u002Fg>`;\n    });\n    bracketsEl.innerHTML = bHtml;\n\n    // Hub-and-spoke arcs: every active region connects back to the New Zealand hub.\n    function arcPath(a, b, samples = 80) {\n      const interp = d3.geoInterpolate(a.lonlat, b.lonlat);\n      const pts = [];\n      for (let i = 0; i <= samples; i++) {\n        const [x, y] = projection(interp(i / samples));\n        pts.push([x, y]);\n      }\n      return 'M ' + pts.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' L ');\n    }\n    const hub = active.find(a => a.hub);\n    const spokes = active.filter(a => !a.hub);\n    let arcHtml = '';\n    let travHtml = '';\n    spokes.forEach((s, i) => {\n      const d = arcPath(s, hub);\n      arcHtml += `<path class=\"arc\" d=\"${d}\"/>`;\n      const dur = 3.4 + i * 0.35;\n      const delay = (i * 0.45).toFixed(2);\n      travHtml += `<circle r=\"0.9\" class=\"arc-traveler\" style=\"\n        offset-path: path('${d}');\n        animation: traveler ${dur}s linear infinite;\n        animation-delay: ${delay}s;\"/>`;\n    });\n    arcsEl.innerHTML = arcHtml + travHtml;\n\n    // Global network: a blinking light on EVERY country, each with a faint\n    // spoke back to the New Zealand hub.\n    const netArcsEl   = document.getElementById('m-net-arcs');\n    const netLightsEl = document.getElementById('m-net-lights');\n    let netArc = '', netLight = '', netTrav = '';\n    countries.forEach((f, i) => {\n      const id = norm(f.id);\n      if (ACTIVE_IDS.has(id)) return;          // hub itself\n      const c = d3.geoCentroid(f);\n      if (!isFinite(c[0]) || !isFinite(c[1])) return;\n      const [x, y] = projection(c);\n      // faint great-circle spoke to the hub\n      const d = arcPath({ lonlat: c }, hub, 40);\n      netArc += `<path class=\"net-arc\" d=\"${d}\"/>`;\n      const delay = ((i % 13) * 0.2).toFixed(2);\n      netLight += `<circle class=\"net-light\" cx=\"${x.toFixed(2)}\" cy=\"${y.toFixed(2)}\" r=\"0.55\" style=\"animation-delay:${delay}s\"/>`;\n      // traveling dot flowing toward New Zealand\n      const dur = (4.5 + (i % 9) * 0.6).toFixed(2);\n      const tdelay = ((i % 17) * 0.28).toFixed(2);\n      netTrav += `<circle r=\"0.6\" class=\"net-traveler\" style=\"\n        offset-path: path('${d}');\n        animation: traveler ${dur}s linear infinite;\n        animation-delay: ${tdelay}s;\"/>`;\n    });\n    netArcsEl.innerHTML   = netArc + netTrav;\n    netLightsEl.innerHTML = netLight;\n\n    // Labels removed — country names now live in the side panel.\n    // We keep the leader-dot at each centroid for a subtle ground anchor.\n    let lHtml = '';\n    active.forEach(a => {\n      lHtml += `<circle class=\"leader-dot\" cx=\"${a.x}\" cy=\"${a.y}\" r=\"0.5\"/>`;\n    });\n    labelsEl.innerHTML = lHtml;\n\n    // Populate side panel\n    const panelList = document.getElementById('panel-list');\n    panelList.innerHTML = ACTIVE.map(a => `\n      <li>\n        <span class=\"led\"><\u002Fspan>\n        <span class=\"name\">${a.name}<\u002Fspan>\n        <span class=\"iso${a.hub ? ' hub' : ''}\">${a.hub ? 'HUB' : 'ACTIVE'}<\u002Fspan>\n      <\u002Fli>\n    `).join('');\n\n    // HUD ticker — timestamp + pseudo-ping\n    const tsEl = document.getElementById('ts');\n    const pingEl = document.getElementById('ping');\n    function pad(n, w = 2) { return String(n).padStart(w, '0'); }\n    function tick() {\n      const d = new Date();\n      const s = `${d.getUTCFullYear()}·${pad(d.getUTCMonth()+1)}·${pad(d.getUTCDate())} / ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;\n      tsEl.textContent = s;\n      const p = 32 + Math.floor(Math.random() * 28);\n      pingEl.textContent = `PING ${pad(p, 3)}ms`;\n    }\n    tick(); setInterval(tick, 1000);\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
